# ========================================
# PRODUCTION ENVIRONMENT OVERLAY
# ========================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: clixx-prod

resources:
  - ../../base

nameSuffix: -prod

commonLabels:
  environment: prod

images:
  - name: 924305315126.dkr.ecr.us-east-1.amazonaws.com/clixx-repository2
    newTag: prod-latest

patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: pdb-patch.yaml

configMapGenerator:
  - name: clixx-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - ENVIRONMENT=prod
