# ========================================
# KUSTOMIZE BASE CONFIGURATION
# ========================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: clixx-base

namespace: clixx

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml

commonLabels:
  app.kubernetes.io/name: clixx-web-app
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: clixx-retail

configMapGenerator:
  - name: clixx-config
    literals:
      - APP_NAME=clixx-retail
      - LOG_LEVEL=info
