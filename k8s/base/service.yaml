# ========================================
# CLIXX SERVICE CONFIGURATION
# ========================================
apiVersion: v1
kind: Service
metadata:
  name: clixx-service
  labels:
    app: clixx-web-app
    service: clixx
spec:
  type: NodePort
  selector:
    app: clixx-web-app
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 80
      nodePort: 30000
  sessionAffinity: None
